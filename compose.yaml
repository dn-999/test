services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Taipei
      GENERIC_TIMEZONE: Asia/Taipei
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:8080/}
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n_data:/home/node/.n8n

  webhook-gateway:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - n8n

volumes:
  n8n_data:
